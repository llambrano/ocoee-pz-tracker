name: Scrape Ocoee P&Z Meetings

on:
  schedule:
    - cron: "0 8 * * 2"   # every Tuesday 08:00 UTC (4 AM ET)
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # was 15 — much faster now, no browser

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests   # that's all we need now

      - name: Run scraper
        run: python scraper.py

      - name: Show results summary
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("data/meetings.json"))
          print(f"Scraped at : {d['scrapedAt']}")
          print(f"Meetings   : {d['count']}")
          for m in d['meetings']:
              tag = "[CANCELED]" if m['canceled'] else ""
              docs = len(m['documents'])
              print(f"  {m['eventId']} | {m['date'][:10]} | {m['title']} {tag} | {docs} docs")
          EOF

      - name: Commit & push updated data
        run: |
          git config user.name  "ocoee-pz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/meetings.json
          git stash
          git pull --rebase origin main
          git stash pop
          git diff --staged --quiet && git add data/meetings.json
          git diff --staged --quiet || git commit -m "chore: scrape P&Z meetings $(date -u +%Y-%m-%d)"
          git push origin main
