<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ocoee Planning & Zoning Commission</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="https://www.ocoee.org/favicon.ico" />
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API    = "https://ocoeefl.api.civicclerk.com/v1";
    const CDN    = `${API}/stream/OCOEEFL`;
    const PORTAL = "https://ocoeefl.portal.civicclerk.com";
    const PZ_CAT = 27;

    const fileUrl = (raw = "") =>
      raw.startsWith("http") ? raw : `${CDN}/${raw.replace("stream/OCOEEFL/", "")}`;

    async function fetchAllPZEvents() {
      const all = [];
      let url = `${API}/Events?$filter=eventCategoryId eq ${PZ_CAT}&$orderby=startDateTime desc`;
      while (url) {
        const res = await fetch(url, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error(`API error ${res.status}`);
        const data = await res.json();
        all.push(...(data.value || []));
        url = data["@odata.nextLink"] || null;
      }
      return all;
    }

    function shapeMeeting(e) {
      const docs = (e.publishedFiles || []).map(f => ({
        label: f.name || f.type, type: f.type, url: fileUrl(f.url),
      }));
      const byType = t => docs.find(d => d.type === t)?.url || null;
      return {
        eventId: e.id,
        title: e.eventName,
        canceled: e.eventName?.toLowerCase().startsWith("canceled"),
        date: e.startDateTime || e.eventDate,
        agendaPosted: e.publishedAgendaTimeStamp || "",
        location: (e.eventLocation?.address1 || "1 N Bluford Ave"),
        hasAgenda: e.hasAgenda,
        agendaUrl: byType("Agenda"),
        minutesUrl: byType("Minutes"),
        packetUrl: byType("Agenda Packet"),
        documents: docs,
        portalUrl: `${PORTAL}/event/${e.id}/files`,
      };
    }

    const fmtDate = raw => {
      if (!raw) return "TBD";
      const d = new Date(raw);
      return d.toLocaleDateString("en-US", { weekday: "short", year: "numeric", month: "short", day: "numeric" })
        + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
    };

    const docIcon = t => ({ Agenda: "📋", Minutes: "📝", "Agenda Packet": "📦" }[t] || "📄");

    function MeetingCard({ m, isUpcoming }) {
      const [open, setOpen] = useState(false);
      return (
        <div className={`bg-white rounded-xl border shadow-sm overflow-hidden hover:shadow-md transition-shadow
          ${m.canceled ? "border-red-200 opacity-75" : isUpcoming ? "border-blue-300" : "border-gray-200"}`}>
          <div className={`px-1 py-0.5 text-xs font-semibold text-center tracking-wide
            ${m.canceled ? "bg-red-100 text-red-700" : isUpcoming ? "bg-blue-600 text-white" : "bg-gray-100 text-gray-500"}`}>
            {m.canceled ? "🔴 CANCELED" : isUpcoming ? "📅 UPCOMING" : "✅ PAST"}
          </div>
          <div className="p-4">
            <h3 className="font-semibold text-gray-900 text-sm leading-snug mb-2">{m.title}</h3>
            <div className="text-xs text-gray-500 mb-1">📅 {fmtDate(m.date)}</div>
            <div className="text-xs text-gray-400 mb-3">📍 {m.location}, Ocoee FL</div>

            <div className="flex flex-wrap gap-1.5 mb-3">
              {m.agendaUrl && (
                <a href={m.agendaUrl} target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 px-2 py-1 text-xs bg-blue-50 text-blue-700 rounded-full border border-blue-200 hover:bg-blue-100">
                  📋 Agenda ↗
                </a>
              )}
              {m.packetUrl && (
                <a href={m.packetUrl} target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 px-2 py-1 text-xs bg-purple-50 text-purple-700 rounded-full border border-purple-200 hover:bg-purple-100">
                  📦 Packet ↗
                </a>
              )}
              {m.minutesUrl && (
                <a href={m.minutesUrl} target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 px-2 py-1 text-xs bg-green-50 text-green-700 rounded-full border border-green-200 hover:bg-green-100">
                  📝 Minutes ↗
                </a>
              )}
              {!m.agendaUrl && !m.minutesUrl && (
                <span className="text-xs text-gray-400 italic">No documents yet</span>
              )}
            </div>

            {m.documents.length > 0 && (
              <button onClick={() => setOpen(o => !o)}
                className="text-xs text-gray-400 hover:text-gray-600 mb-2">
                {open ? "▲ Hide" : "▼ Show all"} {m.documents.length} document(s)
              </button>
            )}
            {open && (
              <div className="space-y-1 mb-3 pl-2 border-l-2 border-gray-100">
                {m.documents.map((doc, i) => (
                  <a key={i} href={doc.url} target="_blank" rel="noopener noreferrer"
                    className="flex items-center gap-1.5 text-xs text-gray-700 hover:text-blue-600">
                    {docIcon(doc.type)} {doc.label} ↗
                  </a>
                ))}
              </div>
            )}

            {m.agendaPosted && (
              <p className="text-xs text-gray-400 italic mb-2">{m.agendaPosted}</p>
            )}

            <a href={m.portalUrl} target="_blank" rel="noopener noreferrer"
              className="flex items-center justify-center gap-1 w-full py-1.5 text-xs text-gray-500 bg-gray-50 rounded-lg border border-gray-200 hover:bg-gray-100">
              View on CivicClerk ↗
            </a>
          </div>
        </div>
      );
    }

    function App() {
      const [meetings, setMeetings] = useState({ upcoming: [], past: [], all: [] });
      const [loading, setLoading]   = useState(true);
      const [error, setError]       = useState(null);
      const [search, setSearch]     = useState("");
      const [tab, setTab]           = useState("upcoming");

      const load = async () => {
        setLoading(true); setError(null);
        try {
          const now = new Date().toISOString();
          const raw = await fetchAllPZEvents();
          const shaped = raw.map(shapeMeeting);
          const upcoming = shaped.filter(m => !m.canceled && m.date >= now).sort((a,b) => a.date.localeCompare(b.date));
          const past     = shaped.filter(m => m.canceled  || m.date <  now).sort((a,b) => b.date.localeCompare(a.date));
          setMeetings({ upcoming, past, all: [...upcoming, ...past] });
        } catch(e) { setError(e.message); }
        finally { setLoading(false); }
      };

      useEffect(() => { load(); }, []);

      const now = new Date().toISOString();
      const pool = meetings[tab] || [];
      const filtered = search
        ? pool.filter(m => [m.title, m.date, ...m.documents.map(d=>d.label)].join(" ").toLowerCase().includes(search.toLowerCase()))
        : pool;

      return (
        <div className="min-h-screen bg-slate-50">
          <div className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-10">
            <div className="max-w-5xl mx-auto px-4 py-4">
              <div className="flex items-start justify-between mb-3">
                <div>
                  <h1 className="text-lg font-bold text-gray-900">Ocoee Planning & Zoning Commission</h1>
                  <p className="text-xs text-gray-500 mt-0.5">
                    ⏰ 2nd Tuesday of each month · 6:15 PM ET · 1 N Bluford Ave
                    {!loading && <span className="ml-2 text-green-600 font-medium">· {meetings.all.length} meetings loaded live</span>}
                  </p>
                </div>
                <button onClick={load} className="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded text-gray-600">↻ Refresh</button>
              </div>
              <div className="flex items-center gap-2">
                <div className="flex rounded-lg border border-gray-200 overflow-hidden text-xs">
                  {["upcoming","past","all"].map(t => (
                    <button key={t} onClick={() => setTab(t)}
                      className={`px-3 py-1.5 capitalize ${tab===t ? "bg-blue-600 text-white" : "bg-white text-gray-600 hover:bg-gray-50"}`}>
                      {t} {meetings[t]?.length ? `(${meetings[t].length})` : ""}
                    </button>
                  ))}
                </div>
                <input value={search} onChange={e => setSearch(e.target.value)}
                  placeholder="Search meetings…"
                  className="flex-1 px-3 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
            </div>
          </div>

          <div className="max-w-5xl mx-auto px-4 py-6">
            {loading && <div className="text-center py-20 text-gray-400">⏳ Loading live data from CivicClerk…</div>}
            {error   && <div className="bg-red-50 border border-red-200 rounded-lg p-4 text-sm text-red-700">⚠️ {error}</div>}
            {!loading && !error && filtered.length === 0 && <div className="text-center py-16 text-gray-400 text-sm">No meetings found.</div>}
            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              {filtered.map(m => <MeetingCard key={m.eventId} m={m} isUpcoming={!m.canceled && m.date >= now} />)}
            </div>
          </div>

          <footer className="text-center text-xs text-gray-400 py-6">
            Data from <a href="https://ocoeefl.portal.civicclerk.com" target="_blank" className="underline">Ocoee CivicClerk</a> · 
            <a href="https://github.com/llambrano/ocoee-pz-tracker" target="_blank" className="underline ml-1">GitHub</a>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
